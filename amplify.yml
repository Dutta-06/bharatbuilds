# Amplify Hosting build for the dashboard (monorepo: app root = dashboard).
# Set VITE_API_URL in the Amplify console to the stack's ApiUrl output.
version: 1
applications:
  - appRoot: dashboard
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
