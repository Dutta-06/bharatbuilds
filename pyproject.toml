[project]
name = "chhaanv"
version = "0.1.0"
description = "Heat and water risk layer for Indian cities"
requires-python = ">=3.12"
dependencies = []  # engine is stdlib-only so it drops straight into Lambda

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.18", "boto3>=1.34", "moto[dynamodb,s3]>=5", "pyyaml>=6"]  # keep in sync with requirements-dev.txt

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
