[project]
name = "pravaah"
version = "0.1.0"
description = "Water- and carbon-aware scheduling for AI workloads"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.18"]  # see requirements-dev.txt

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
