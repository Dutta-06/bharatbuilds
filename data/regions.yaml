# AWS regions Pravaah can place jobs in.
#
# Step 1 needs: location (for weather), cooling type, and which disclosed WUE to
# calibrate against. Step 2 fills in the rest from real data:
#   - electricity_maps_zone: confirm each against the Electricity Maps zone list
#   - grid_mix / typical_ci_g_per_kwh: PLACEHOLDERS (rough annual shares and
#     intensities from memory) so the CLI runs before the pipeline exists.
#     Replace with Electricity Maps power-breakdown history.
#   - water_stress_score: WRI Aqueduct baseline water stress (0-5) for the site's
#     basin; null means "not looked up yet" and gives a multiplier of 1.0.
#   - wue_scale: written by scripts/calibrate_wue.py from a year of weather history.
#
# Coordinates are the metro area the region is named after, not facility sites
# (AWS does not publish those).
#
# Cooling types: AWS describes direct evaporative ("adiabatic") cooling for most
# regions; in hot humid climates where that cannot work (wet-bulb near setpoint
# all year) we assume chilled water with cooling towers.

regions:
  - id: ap-south-1
    name: Asia Pacific (Mumbai)
    lat: 19.08
    lon: 72.88
    cooling_type: tower
    electricity_maps_zone: IN-WE
    disclosed_wue_key: asia-pacific-aggregate   # no Mumbai-specific figure
    water_stress_score: null
    grid_mix: {placeholder: true, shares: {coal: 0.72, gas: 0.03, hydro: 0.08, nuclear: 0.03, solar: 0.08, wind: 0.05, biomass: 0.01}}
    typical_ci_g_per_kwh: 680            # placeholder

