AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Chhaanv - heat and water risk layer for Indian cities

# Build with `make build` (packs engine/, backend/ and data/ into the core layer,
# then runs `sam build`). Data model: docs/data-model.md.

Parameters:
  TableReadCapacity:
    Type: Number
    Default: 15
    Description: Provisioned RCU for the table (table + GSI stay within the 25 RCU free tier)
  TableWriteCapacity:
    Type: Number
    Default: 20
    Description: Provisioned WCU for the table (table + GSI stay within the 25 WCU free tier)

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 256
    Timeout: 10
    Layers:
      - !Ref CoreLayer
    Environment:
      Variables:
        TABLE_NAME: !Ref MainTable
        BUCKET_NAME: !Ref DataBucket
        LOCAL_ENDPOINT_URL: ""  # set by env.local.json for sam local + LocalStack only
  HttpApi:
    CorsConfiguration:
      AllowOrigins: ["*"]
      AllowMethods: [GET, POST, OPTIONS]
      AllowHeaders: [content-type]

Resources:
  MainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: chhaanv-main
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: !Ref TableReadCapacity
        WriteCapacityUnits: !Ref TableWriteCapacity
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: GSI1PK, AttributeType: S}
        - {AttributeName: GSI1SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - {AttributeName: GSI1PK, KeyType: HASH}
            - {AttributeName: GSI1SK, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
          ProvisionedThroughput: {ReadCapacityUnits: 5, WriteCapacityUnits: 5}
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CoreLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: chhaanv-core
      Description: Risk engine, AWS helpers and city data
      ContentUri: build/layer/
      CompatibleRuntimes: [python3.12]

  FetchForecastFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/fetch_forecast/
      Handler: app.handler
      Timeout: 20

  ComputeRiskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/compute_risk/
      Handler: app.handler
      Timeout: 30
      Policies:
        - DynamoDBWritePolicy: {TableName: !Ref MainTable}

  GetRiskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/get_risk/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref MainTable}
      Events:
        GetRisk:
          Type: HttpApi
          Properties: {Path: /risk, Method: get}

  SubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/subscribe/
      Handler: app.handler
      Policies:
        - DynamoDBWritePolicy: {TableName: !Ref MainTable}
      Events:
        Subscribe:
          Type: HttpApi
          Properties: {Path: /subscribe, Method: post}

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/health/
      Handler: app.handler
      Events:
        Health:
          Type: HttpApi
          Properties: {Path: /health, Method: get}

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  TableName:
    Value: !Ref MainTable
  BucketName:
    Value: !Ref DataBucket
  FetchForecastFunctionName:
    Value: !Ref FetchForecastFunction
  ComputeRiskFunctionName:
    Value: !Ref ComputeRiskFunction
